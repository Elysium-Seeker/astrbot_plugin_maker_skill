name: Validate skill and generated plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m ruff check .github/skills/astrbot-plugin-maker/scripts tests
      - run: python -m ruff format --check .github/skills/astrbot-plugin-maker/scripts tests

  astrbot-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt astrbot==4.28.0
      - name: Generate plugin with real metadata and configuration
        run: >-
          python .github/skills/astrbot-plugin-maker/scripts/scaffold_plugin.py
          "${{ runner.temp }}/astrbot_plugin_sdk_check"
          --author "SDK Test" --description "SDK smoke test" --command greet
      - name: Test real registration, config injection, and command results
        working-directory: ${{ runner.temp }}/astrbot_plugin_sdk_check
        run: python -m pytest runtime_tests -q
