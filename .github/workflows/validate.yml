name: Validate skill and generated plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m ruff check .github/skills/astrbot-plugin-maker/scripts tests
      - run: python -m ruff format --check .github/skills/astrbot-plugin-maker/scripts tests

  generated-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: basic
            args: ""
          - mode: http
            args: "--with-openapi"
    name: generated dependencies (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate using only the standard library
        run: >-
          python .github/skills/astrbot-plugin-maker/scripts/scaffold_plugin.py
          "${{ runner.temp }}/astrbot_plugin_install_check"
          --author "Dependency Test" --description "Clean install test"
          ${{ matrix.args }}
      - name: Install only the generated dependency declarations into a clean venv
        working-directory: ${{ runner.temp }}/astrbot_plugin_install_check
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then
            .venv/bin/python -m pip install -r requirements.txt
          fi
      - name: Validate and test without the repository development environment
        working-directory: ${{ runner.temp }}/astrbot_plugin_install_check
        run: |
          .venv/bin/python "$GITHUB_WORKSPACE/.github/skills/astrbot-plugin-maker/scripts/validate_plugin.py" .
          .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .

  astrbot-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt astrbot==4.28.0
      - name: Generate plugin with real metadata and configuration
        run: >-
          python .github/skills/astrbot-plugin-maker/scripts/scaffold_plugin.py
          "${{ runner.temp }}/astrbot_plugin_sdk_check"
          --author "SDK Test" --description "SDK smoke test" --command greet
      - name: Test real registration, config injection, and command results
        working-directory: ${{ runner.temp }}/astrbot_plugin_sdk_check
        run: python -m pytest runtime_tests -q
